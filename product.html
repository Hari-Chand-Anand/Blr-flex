<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Info</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #0c2136;
            --navy-deep: #081625;
            --gold: #c6a15b;
            --gold-light: #e2c98a;
            --cream: #faf7f2;
            --ink: #1c2530;
            --muted: #7c8797;
            --hairline: #e7e1d6;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
        }

        .serif {
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        }

        .wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 18px 40px;
        }

        /* ---------- Header ---------- */
        .header {
            position: relative;
            background:
                radial-gradient(circle at 15% 0%, rgba(198,161,91,0.12), transparent 55%),
                linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
            border-radius: 18px;
            padding: 32px 26px 28px;
            color: white;
            margin-bottom: 22px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(8,22,37,0.25);
        }

        .header::after {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(198,161,91,0.28);
            border-radius: 12px;
            pointer-events: none;
        }

        .crest-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .crest {
            width: 44px;
            height: 44px;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .crest span {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 15px;
            color: var(--gold-light);
            letter-spacing: 0.5px;
        }

        .brand-text .name {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: #f1ece1;
        }

        .brand-text .est {
            font-size: 10.5px;
            color: var(--gold-light);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
            opacity: 0.85;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #ffffff;
            line-height: 1.15;
        }

        .divider-gold {
            width: 46px;
            height: 2px;
            background: var(--gold);
            margin: 14px 0 4px;
            border-radius: 2px;
        }

        .header .tag {
            font-size: 12px;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.4px;
        }

        /* ---------- Cards ---------- */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin: 4px 4px 12px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 18px 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(12,33,54,0.06);
            border: 1px solid var(--hairline);
            border-left: 3px solid transparent;
            transition: box-shadow 0.25s ease, transform 0.25s ease, border-left-color 0.25s ease;
            width: 100%;
            text-align: left;
        }

        .card:hover {
            box-shadow: 0 10px 24px rgba(12,33,54,0.12);
            transform: translateY(-2px);
            border-left-color: var(--gold);
        }

        .card .icon-badge {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card .icon-badge svg {
            width: 20px;
            height: 20px;
            stroke: var(--gold-light);
        }

        .card .text { flex: 1; min-width: 0; }

        .card .title {
            font-family: 'Playfair Display', serif;
            font-size: 16.5px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 3px;
        }

        .card .subtitle {
            font-size: 12.5px;
            color: var(--muted);
        }

        .card .chevron {
            color: var(--gold);
            font-size: 18px;
            flex-shrink: 0;
        }

        .footer {
            text-align: center;
            padding: 26px 10px 6px;
        }

        .footer .line {
            width: 60px;
            height: 1px;
            background: var(--hairline);
            margin: 0 auto 14px;
        }

        .footer .tagline {
            font-family: 'Playfair Display', serif;
            font-size: 12.5px;
            color: var(--navy);
            letter-spacing: 0.4px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .footer .sub {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.3px;
        }

        /* ---------- Modal ---------- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(8,22,37,0.82);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.active { display: flex; }

        .modal-box {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--navy), var(--navy-deep));
            color: white;
            border-bottom: 2px solid var(--gold);
        }

        .modal-head h2 {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
        }

        .modal-head button {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(198,161,91,0.4);
            color: var(--gold-light);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f2ee;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--hairline);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: white;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.2px;
        }

        .btn-download {
            background: var(--navy);
            color: var(--gold-light);
        }

        .btn-download:hover { background: var(--navy-deep); }

        .btn-close {
            background: #f0ede6;
            color: var(--ink);
        }

        .btn-close:hover { background: #e7e1d6; }

        .placeholder {
            text-align: center;
            padding: 50px 24px;
            color: var(--muted);
        }

        .placeholder .icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
        }

        .placeholder .icon-badge svg {
            width: 24px;
            height: 24px;
            stroke: var(--gold-light);
        }

        .placeholder h3 {
            font-family: 'Playfair Display', serif;
            color: var(--ink);
            font-size: 17px;
            margin-bottom: 8px;
        }

        .placeholder p {
            font-size: 13px;
            max-width: 300px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .error-box {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }

        .error-box h2 {
            font-family: 'Playfair Display', serif;
            color: var(--navy);
        }
    </style>
</head>
<body>
    <div class="wrap" id="app"></div>

    <div class="modal" id="catalogModal">
        <div class="modal-box">
            <div class="modal-head">
                <h2 id="catalogModalTitle">Machine Catalog</h2>
                <button onclick="closeModal('catalogModal')">✕</button>
            </div>
            <div class="modal-body" id="catalogModalBody"></div>
            <div class="modal-foot">
                <button class="btn btn-download" onclick="downloadCatalog()">⬇ Download PDF</button>
                <button class="btn btn-close" onclick="closeModal('catalogModal')">Close</button>
            </div>
        </div>
    </div>

    <div class="modal" id="videoModal">
        <div class="modal-box" style="height: auto;">
            <div class="modal-head">
                <h2 id="videoModalTitle">Machine Video</h2>
                <button onclick="closeModal('videoModal')">✕</button>
            </div>
            <div class="modal-body" id="videoModalBody" style="padding: 0;"></div>
            <div class="modal-foot">
                <button class="btn btn-close" onclick="closeModal('videoModal')">Close</button>
            </div>
        </div>
    </div>

    <script>
        const MACHINES = {
            'dy-r9': { name: 'DY R9', pdf: 'DY R9.pdf', videoId: 'WhDY_3HdMac' },
            'fb450': { name: 'FB450', pdf: 'FB450.pdf', videoId: 'KwYO0CGbFR0' },
            'pl-puller': { name: 'PL PULLER', pdf: 'New_Racing General Catalouge.pdf', videoId: 'N49qgVG6lcc' }
        };

        const WHATSAPP_NUMBER = '919740811061';

        const ICONS = {
            catalog: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/></svg>',
            video: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>',
            contact: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'
        };

        const params = new URLSearchParams(window.location.search);
        const machineId = params.get('m');
        const machine = MACHINES[machineId];

        const app = document.getElementById('app');

        if (!machine) {
            app.innerHTML = `
                <div class="error-box">
                    <h2 class="serif">Machine not found</h2>
                    <p style="margin-top:10px; font-size:14px;">Please scan a valid QR code.</p>
                </div>
            `;
        } else {
            document.title = machine.name + ' | Hari Chand Anand & Co.';
            app.innerHTML = `
                <div class="header">
                    <div class="crest-row">
                        <div class="crest"><span>HCA</span></div>
                        <div class="brand-text">
                            <div class="name">HARI CHAND ANAND &amp; CO.</div>
                            <div class="est">Est. 1910 &nbsp;·&nbsp; Bangalore</div>
                        </div>
                    </div>
                    <h1 class="serif">${machine.name}</h1>
                    <div class="divider-gold"></div>
                    <div class="tag">Precision Engineering Since 1910</div>
                </div>

                <div class="section-label">Machine Resources</div>

                <button class="card" onclick="openCatalog()">
                    <div class="icon-badge">${ICONS.catalog}</div>
                    <div class="text">
                        <div class="title">Machine Catalog</div>
                        <div class="subtitle">Technical docs &amp; specifications</div>
                    </div>
                    <div class="chevron">›</div>
                </button>

                <button class="card" onclick="openVideo()">
                    <div class="icon-badge">${ICONS.video}</div>
                    <div class="text">
                        <div class="title">Machine Video</div>
                        <div class="subtitle">Demo &amp; operation instructions</div>
                    </div>
                    <div class="chevron">›</div>
                </button>

                <button class="card" onclick="openContact()">
                    <div class="icon-badge">${ICONS.contact}</div>
                    <div class="text">
                        <div class="title">Contact Us</div>
                        <div class="subtitle">WhatsApp support team instantly</div>
                    </div>
                    <div class="chevron">›</div>
                </button>

                <div class="footer">
                    <div class="line"></div>
                    <div class="tagline">Hari Chand Anand &amp; Co.</div>
                    <div class="sub">A Legacy of Trust Since 1910</div>
                </div>
            `;
        }

        function openCatalog() {
            document.getElementById('catalogModalTitle').textContent = machine.name + ' — Catalog';
            const pdfAbsoluteUrl = window.location.origin + '/' + encodeURI(machine.pdf);
            const viewerUrl = 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(pdfAbsoluteUrl);
            document.getElementById('catalogModalBody').innerHTML =
                `<iframe src="${viewerUrl}"></iframe>`;
            document.getElementById('catalogModal').classList.add('active');
        }

        function downloadCatalog() {
            const link = document.createElement('a');
            link.href = machine.pdf;
            link.download = machine.pdf;
            link.click();
        }

        function openVideo() {
            document.getElementById('videoModalTitle').textContent = machine.name + ' — Video';
            const body = document.getElementById('videoModalBody');
            if (machine.videoId) {
                body.innerHTML = `
                    <div style="position:relative; width:100%; padding-bottom:56.25%;">
                        <iframe style="position:absolute; top:0; left:0; width:100%; height:100%;"
                            src="https://www.youtube.com/embed/${machine.videoId}" allowfullscreen></iframe>
                    </div>`;
            } else {
                body.innerHTML = `
                    <div class="placeholder">
                        <div class="icon-badge">${ICONS.video}</div>
                        <h3>Video coming soon</h3>
                        <p>Demo and operation instructions for ${machine.name} will be added here.</p>
                    </div>`;
            }
            document.getElementById('videoModal').classList.add('active');
        }

        function openContact() {
            const message = `Good day, I am interested in learning more about the ${machine.name} machine and would appreciate assistance regarding its specifications and support options. Thank you.`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if (id === 'catalogModal') document.getElementById('catalogModalBody').innerHTML = '';
        }
    </script>
</body>
</html>
